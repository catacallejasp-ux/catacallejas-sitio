name: CI

# Runs only what tells you the site is broken: type errors and the build.
# Formatting is `pnpm format`, locally — a red X for a missing newline helps nobody.
# See docs/ADR/0004-nothing-blocks-a-first-run-except-a-broken-build.md

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build
